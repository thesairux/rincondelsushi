<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Rincón Sushi Manager</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="any">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Sistema del local de El Rincón del Sushi: pedidos, cocina, caja, pagos, clientes, delivery e informes.">
<meta name="theme-color" content="#0e0d10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap">
<style>
/* Layout: riel oscuro a la izquierda + superficie de trabajo clara; tarjetas densas de operación; tipografía condensada para números y títulos. */
:root {
  --bg: #f4f3f2;
  --panel: #ffffff;
  --panel-2: #f9f8f7;
  --hover: #f1efee;
  --line: #e7e4e2;
  --line-2: #d6d2cf;
  --fg: #16141a;
  --muted: #67616d;
  --faint: #99939e;
  --accent: #d1161e;
  --accent-strong: #a8111a;
  --accent-soft: #fdeceb;
  --accent-line: #f3bcb9;
  --on-accent: #ffffff;
  --ink: #16141a;
  --on-ink: #ffffff;
  --side-bg: #0e0d10;
  --side-2: #19171c;
  --side-fg: #dcd8df;
  --side-muted: #77717d;
  --ok: #15803d;
  --ok-soft: #e6f5eb;
  --warn: #a85a06;
  --warn-soft: #fff5de;
  --warn-line: #f2c56a;
  --bad: #c41c1c;
  --bad-soft: #fdeaea;
  --info: #5a49d4;
  --info-soft: #eeecfd;
  --s-recibido: #8b8590;
  --s-confirmado: #16141a;
  --s-prep: #e2820b;
  --s-listo: #16a34a;
  --s-camino: #6a57e3;
  --s-final: #a29ca7;
  --chart-1: #d1161e;
  --chart-2: #16141a;
  --chart-3: #6a57e3;
  --chart-4: #e2820b;
  --chart-5: #16a34a;
  --chart-6: #e98aa0;
  --shadow: 0 1px 2px rgba(22, 20, 26, .05), 0 6px 18px rgba(22, 20, 26, .06);
  --shadow-lg: 0 20px 50px rgba(22, 20, 26, .22);
  --kds-bg: #0b0a0d;
  --kds-card: #ffffff;
  --kds-fg: #16141a;
  --kds-muted: #6d6772;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 10px;
  --r-sm: 7px;
  --side-w: 236px;
  --top-h: 60px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f0e11; --panel: #18171b; --panel-2: #1d1c21; --hover: #232128; --line: #2a282f; --line-2: #3a3740;
    --fg: #f2f0f4; --muted: #a59fad; --faint: #726c79; --accent: #ec3a40; --accent-strong: #ff5a5f; --accent-soft: #34161a; --accent-line: #6b2428;
    --on-accent: #ffffff; --ink: #f2f0f4; --on-ink: #16141a; --side-bg: #08070a; --side-2: #141317; --side-fg: #dcd8df; --side-muted: #6f6975;
    --ok: #4ade80; --ok-soft: #10291a; --warn: #f6b23c; --warn-soft: #2c210c; --warn-line: #6b4f14; --bad: #f87171; --bad-soft: #2f1414; --info: #a197ff; --info-soft: #1f1b3d;
    --s-recibido: #8f8995; --s-confirmado: #f2f0f4; --s-prep: #f59e0b; --s-listo: #22c55e; --s-camino: #8b7cff; --s-final: #6f6975;
    --chart-1: #ec3a40; --chart-2: #f2f0f4; --chart-3: #8b7cff; --chart-4: #f59e0b; --chart-5: #22c55e; --chart-6: #f19ab0;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25); --shadow-lg: 0 20px 50px rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f0e11; --panel: #18171b; --panel-2: #1d1c21; --hover: #232128; --line: #2a282f; --line-2: #3a3740;
  --fg: #f2f0f4; --muted: #a59fad; --faint: #726c79; --accent: #ec3a40; --accent-strong: #ff5a5f; --accent-soft: #34161a; --accent-line: #6b2428;
  --on-accent: #ffffff; --ink: #f2f0f4; --on-ink: #16141a; --side-bg: #08070a; --side-2: #141317; --side-fg: #dcd8df; --side-muted: #6f6975;
  --ok: #4ade80; --ok-soft: #10291a; --warn: #f6b23c; --warn-soft: #2c210c; --warn-line: #6b4f14; --bad: #f87171; --bad-soft: #2f1414; --info: #a197ff; --info-soft: #1f1b3d;
  --s-recibido: #8f8995; --s-confirmado: #f2f0f4; --s-prep: #f59e0b; --s-listo: #22c55e; --s-camino: #8b7cff; --s-final: #6f6975;
  --chart-1: #ec3a40; --chart-2: #f2f0f4; --chart-3: #8b7cff; --chart-4: #f59e0b; --chart-5: #22c55e; --chart-6: #f19ab0;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25); --shadow-lg: 0 20px 50px rgba(0, 0, 0, .55);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 400 14px/1.45 var(--f-body); -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--side-bg); }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.i-sm { width: 15px; height: 15px; }
.i-lg { width: 22px; height: 22px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.nowrap { white-space: nowrap; }
.grow { flex: 1; min-width: 0; }
.row { display: flex; align-items: center; gap: 8px; }
.row-wrap { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.tr { text-align: right; }
.strike { text-decoration: line-through; }

/* ---------- logo ---------- */
.logo { display: inline-flex; align-items: stretch; font: 800 17px/1 var(--f-display); letter-spacing: .02em; text-transform: uppercase; user-select: none; }
.logo b { display: inline-flex; align-items: center; padding: 3px 6px 4px; color: #fff; font-weight: 800; }
.logo .l1 { background: #e3161f; }
.logo .l2 { background: #0b0a0d; position: relative; padding-bottom: 9px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.logo .l2 i { position: absolute; right: 6px; bottom: -1px; font: 800 9px/1 var(--f-display); font-style: normal; color: #ff3b42; letter-spacing: .14em; }
.logo-lg { font-size: 26px; }
.logo-lg b { padding: 5px 9px 6px; }
.logo-lg .l2 { padding-bottom: 13px; }
.logo-lg .l2 i { font-size: 12px; right: 9px; bottom: 0; }

/* ---------- botones ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 36px; padding: 7px 13px; border-radius: var(--r-sm);
  border: 1px solid var(--line-2); background: var(--panel); color: var(--fg);
  font-weight: 600; font-size: 13px; white-space: nowrap; text-decoration: none; transition: background .15s, border-color .15s, transform .1s;
}
.btn:hover { background: var(--hover); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.btn-dark { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.btn-dark:hover { opacity: .88; background: var(--ink); }
.btn-ok { background: var(--s-listo); border-color: var(--s-listo); color: #fff; }
.btn-ok:hover { filter: brightness(.94); background: var(--s-listo); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover { background: var(--hover); }
.btn-danger { color: var(--bad); }
.btn-sm { min-height: 30px; padding: 4px 10px; font-size: 12.5px; }
.btn-xs { min-height: 26px; padding: 3px 8px; font-size: 12px; border-radius: 6px; }
.btn-lg { min-height: 48px; padding: 12px 18px; font-size: 15px; }
.btn-block { width: 100%; }
.btn-icon { width: 36px; padding: 0; }
.btn-icon.btn-sm { width: 30px; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }

/* ---------- pills ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px;
  font-size: 11.5px; font-weight: 600; white-space: nowrap; border: 1px solid var(--line); background: var(--panel-2); color: var(--muted);
}
.pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill-ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pill-warn { background: var(--warn-soft); color: var(--warn); border-color: var(--warn-line); }
.pill-bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill-info { background: var(--info-soft); color: var(--info); border-color: transparent; }
.pill-accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.pill-ink { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.pill-new { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.st { --c: var(--s-recibido); color: var(--fg); }
.st .dot { background: var(--c); }
.st-recibido { --c: var(--s-recibido); }
.st-confirmado { --c: var(--s-confirmado); }
.st-preparacion { --c: var(--s-prep); }
.st-listo { --c: var(--s-listo); }
.st-camino { --c: var(--s-camino); }
.st-entregado { --c: var(--s-final); }
.st-cancelado { --c: var(--bad); color: var(--bad); }

/* ---------- formularios ---------- */
.field { display: grid; gap: 5px; min-width: 0; }
.field > span, .label { font-size: 12px; font-weight: 600; color: var(--muted); }
.input, .select, .textarea {
  width: 100%; min-height: 38px; padding: 8px 11px; border-radius: var(--r-sm);
  border: 1px solid var(--line-2); background: var(--panel); color: var(--fg); font-size: 14px;
}
.textarea { min-height: 76px; resize: vertical; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input-icon { position: relative; }
.input-icon > .i { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
.input-icon > .input { padding-left: 36px; }
.input-icon > .btn-suffix { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); }
.hint { font-size: 12px; color: var(--muted); }
.err { font-size: 12.5px; color: var(--bad); font-weight: 600; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 9px; background: var(--hover); border: 1px solid var(--line); flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 5px 11px; border-radius: 6px; font-size: 12.5px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.seg button.on { background: var(--panel); color: var(--fg); box-shadow: var(--shadow); }
.switch { position: relative; width: 38px; height: 22px; flex: none; display: inline-block; }
.switch input { position: absolute; inset: 0; opacity: 0; cursor: pointer; margin: 0; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line-2); transition: background .2s; }
.switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(16px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 13.5px; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }
.opt {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line-2); border-radius: var(--r-sm);
  background: var(--panel); cursor: pointer; font-size: 13.5px;
}
.opt:hover { background: var(--hover); }
.opt.on { border-color: var(--accent); background: var(--accent-soft); }
.opt.off { opacity: .45; cursor: not-allowed; }
.opt input { accent-color: var(--accent); margin: 0; }
.opt .x { margin-left: auto; font-size: 12.5px; color: var(--muted); font-weight: 600; }

/* ---------- login ---------- */
.login {
  min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding-block: 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background:
    radial-gradient(circle at 88% 92%, rgba(227, 22, 31, .55), transparent 42%),
    radial-gradient(circle at 10% 0%, rgba(227, 22, 31, .14), transparent 40%),
    #0d0c0f;
  color: #f2f0f4; position: relative;
}
.login-top { position: absolute; top: 18px; left: max(18px, env(safe-area-inset-left, 0px)); font-size: 12px; color: #9a94a0; display: flex; gap: 8px; align-items: center; }
.login-card { width: min(100%, 400px); background: #fff; color: #16141a; border-radius: 16px; padding: 30px 28px 24px; box-shadow: 0 30px 70px rgba(0,0,0,.5); display: grid; gap: 16px; }
.login-card h1 { font: 700 19px/1.2 var(--f-body); text-align: center; }
.login-card .sub { text-align: center; color: #6b6570; font-size: 13px; margin-top: -10px; }
.login-card .input { background: #fff; color: #16141a; border-color: #d6d2cf; }
.login-card .field > span { color: #514b56; }
.login-card .muted { color: #6b6570; }
.login-card .btn:not(.btn-primary) { background: #fff; color: #16141a; border-color: #d6d2cf; }
.login-foot { text-align: center; font-size: 12px; color: #6b6570; display: flex; align-items: center; justify-content: center; gap: 6px; }
.login-foot .i { color: #15803d; }
.login-powered { position: absolute; bottom: 16px; left: 0; right: 0; text-align: center; font-size: 11.5px; color: #8f8994; }
.login-powered b { color: #f2f0f4; }
.demo-box { border: 1px dashed #d6d2cf; border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; background: #faf9f8; }
.demo-box b { font-size: 12px; }
.demo-users { display: flex; flex-wrap: wrap; gap: 6px; }
.demo-users button { border: 1px solid #d6d2cf; background: #fff; color: #16141a; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; }
.demo-users button:hover { border-color: #d1161e; color: #d1161e; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100%; }
.app.collapsed { --side-w: 64px; }
.side {
  position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px)); overflow-y: auto; scrollbar-width: thin;
  background: var(--side-bg); color: var(--side-fg); display: flex; flex-direction: column; padding: 14px 10px 12px;
  padding-left: max(10px, env(safe-area-inset-left, 0px));
}
.side-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 2px 4px 2px 6px; }
.side-head .tag { font-size: 11px; color: var(--side-muted); margin: 4px 0 0 6px; }
.side-toggle { width: 26px; height: 26px; border-radius: 50%; border: 1px solid #2e2b33; background: var(--side-2); color: var(--side-fg); display: grid; place-items: center; }
.nav { display: grid; gap: 1px; margin-top: 14px; }
.nav-group { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--side-muted); padding: 14px 10px 6px; }
.nav a {
  display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; text-decoration: none; font-size: 13.5px; font-weight: 500; color: var(--side-fg);
}
.nav a:hover { background: var(--side-2); }
.nav a.on { background: #e3161f; color: #fff; box-shadow: 0 6px 18px rgba(227, 22, 31, .35); }
.nav a .i { color: inherit; opacity: .9; }
.nav .badge { margin-left: auto; min-width: 20px; height: 18px; padding: 0 6px; border-radius: 999px; background: #2a272e; color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.nav a.on .badge { background: rgba(255,255,255,.22); }
.side-foot { margin-top: auto; padding: 14px 8px 0; display: flex; justify-content: space-between; font-size: 11px; color: var(--side-muted); }
.side-foot b { color: var(--side-fg); font-weight: 600; }
.app.collapsed .side .nav a span, .app.collapsed .nav-group, .app.collapsed .side-head .logo, .app.collapsed .side-head .tag, .app.collapsed .side-foot, .app.collapsed .nav .badge { display: none; }
.app.collapsed .nav a { justify-content: center; position: relative; }
.app.collapsed .side-head { justify-content: center; }
.app.collapsed .nav a[data-badge]::after { content: ""; position: absolute; top: 6px; right: 10px; width: 7px; height: 7px; border-radius: 50%; background: #e3161f; }

.main { min-width: 0; display: flex; flex-direction: column; }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; height: var(--top-h); background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px;
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
}
.top .menu-btn { display: none; }
.search { position: relative; width: min(100%, 340px); }
.search .input { height: 38px; min-height: 38px; padding-right: 54px; background: var(--panel); }
.kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 10.5px; font-weight: 600; color: var(--faint); border: 1px solid var(--line-2); border-radius: 5px; padding: 1px 5px; background: var(--panel-2); }
.search-res { position: absolute; top: calc(100% + 6px); left: 0; width: min(92vw, 440px); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 6px; z-index: 40; max-height: 70vh; overflow: auto; }
.search-res .grp { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding: 8px 10px 4px; }
.search-res button { display: flex; width: 100%; align-items: center; gap: 10px; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; }
.search-res button:hover, .search-res button:focus { background: var(--hover); outline: none; }
.top-sp { flex: 1; }
.chip-live { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 11px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid transparent; background: var(--ok-soft); color: var(--ok); }
.chip-live .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 22%, transparent); }
.chip-live.off { background: var(--bad-soft); color: var(--bad); }
.who { display: flex; align-items: center; gap: 9px; border: 0; background: none; padding: 4px 6px; border-radius: 10px; text-align: left; }
.who:hover { background: var(--hover); }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--ink); color: var(--on-ink); flex: none; }
.avatar-sm { width: 26px; height: 26px; font-size: 10.5px; }
.who b { display: block; font-size: 13px; line-height: 1.1; }
.who small { font-size: 11px; color: var(--muted); }
.bell { position: relative; }
.bell .n { position: absolute; top: 3px; right: 3px; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 9.5px; font-weight: 700; display: grid; place-items: center; }
.pop { position: absolute; right: 0; top: calc(100% + 6px); width: min(92vw, 340px); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 6px; z-index: 40; }
.pop .item { display: flex; gap: 10px; padding: 9px 10px; border-radius: 8px; font-size: 13px; align-items: flex-start; width: 100%; border: 0; background: none; text-align: left; }
.pop .item:hover { background: var(--hover); }
.pop .head { padding: 8px 10px 6px; font-weight: 700; font-size: 13px; }
.rel { position: relative; }

.banner-demo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12.5px; background: var(--warn-soft); color: var(--warn); border-bottom: 1px solid var(--warn-line); padding-block: 7px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.banner-demo b { font-weight: 700; }
.banner-ro { background: var(--info-soft); color: var(--info); border-color: transparent; }

.page { padding-block: 22px 48px; padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; align-content: start; min-width: 0; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.crumbs { font-size: 12px; color: var(--faint); margin-bottom: 4px; }
.page-head h1 { font: 700 23px/1.15 var(--f-body); letter-spacing: -.015em; }
.page-head .sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.toolbar .select, .toolbar .input { width: auto; min-height: 34px; padding: 5px 10px; font-size: 13px; }

/* ---------- tarjetas ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.card-pad { padding: 16px 18px; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 15px 18px 0; }
.card-head h3 { font-size: 14.5px; font-weight: 700; }
.card-head .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.card-body { padding: 14px 18px 18px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; min-width: 0; position: relative; }
.kpi-top { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); font-weight: 500; }
.kpi-ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--hover); color: var(--fg); flex: none; }
.kpi-ic.red { background: var(--accent-soft); color: var(--accent); }
.kpi-ic.ok { background: var(--ok-soft); color: var(--ok); }
.kpi-ic.warn { background: var(--warn-soft); color: var(--warn); }
.kpi-ic.info { background: var(--info-soft); color: var(--info); }
.kpi-v { font: 700 25px/1 var(--f-body); letter-spacing: -.02em; display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.kpi-v svg { width: 72px; height: 26px; flex: none; }
.kpi-s { font-size: 11.5px; color: var(--muted); }
.kpi-s .up { color: var(--ok); font-weight: 700; }
.kpi-s .down { color: var(--bad); font-weight: 700; }
.kpi.alert { border-color: var(--warn-line); background: linear-gradient(180deg, var(--warn-soft), var(--panel) 70%); }
.kpi .kpi-act { position: absolute; right: 12px; bottom: 12px; }
.promo-banner { display: flex; align-items: center; gap: 14px; background: #121014; color: #fff; border-radius: 12px; padding: 12px 14px; position: relative; overflow: hidden; }
.promo-banner::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 92% 50%, rgba(227, 22, 31, .55), transparent 45%); pointer-events: none; }
.promo-banner .tile { width: 46px; height: 46px; border-radius: 8px; background: #e3161f; display: grid; place-items: center; font: 800 18px/1 var(--f-display); flex: none; position: relative; z-index: 1; }
.promo-banner b { font-size: 14px; }
.promo-banner small { display: block; font-size: 12px; color: #c9c3ce; }
.promo-banner .btn { margin-left: auto; position: relative; z-index: 1; background: rgba(255,255,255,.06); color: #fff; border-color: rgba(255,255,255,.22); }
.dash-grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 14px; }
.dash-grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.legend { display: grid; gap: 7px; font-size: 12.5px; }
.legend div { display: grid; grid-template-columns: 10px 1fr auto 40px; gap: 8px; align-items: center; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: block; }
.legend b { font-weight: 700; text-align: right; }
.legend span.p { color: var(--faint); text-align: right; font-size: 11.5px; }
.mini-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 14px; }
.mini-stats small { display: block; font-size: 11px; color: var(--muted); }
.mini-stats b { font-size: 15px; }
.bars { display: grid; gap: 9px; }
.bar-row { display: grid; grid-template-columns: minmax(90px, 140px) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 12.5px; }
.bar-row .track { height: 9px; border-radius: 99px; background: var(--hover); overflow: hidden; }
.bar-row .track i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
.bar-row b { font-weight: 700; white-space: nowrap; }
.bar-row b small { color: var(--faint); font-weight: 500; margin-left: 4px; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--f-body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ln { fill: none; stroke: var(--chart-1); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
.chart .ln2 { fill: none; stroke: var(--faint); stroke-width: 1.6; stroke-dasharray: 4 4; }
.chart .ar { fill: var(--chart-1); opacity: .12; }
.chart .pt { fill: var(--chart-1); stroke: var(--panel); stroke-width: 2.5; }
.chart .bar { fill: var(--accent); opacity: .32; }
.chart .bar.hl { opacity: 1; }
.chart .hit { fill: transparent; cursor: crosshair; }
.chart-tip { position: absolute; pointer-events: none; background: #16141a; color: #fff; border-radius: 8px; padding: 7px 10px; font-size: 11.5px; line-height: 1.35; box-shadow: var(--shadow-lg); transform: translate(-50%, calc(-100% - 10px)); white-space: nowrap; z-index: 5; }
.chart-tip b { font-size: 13.5px; display: block; }
.chart-wrap { position: relative; }
.heat { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; align-items: end; height: 110px; }
.heat div { background: var(--accent); border-radius: 4px 4px 1px 1px; min-height: 3px; position: relative; }
.heat-l { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; font-size: 10.5px; color: var(--faint); text-align: center; margin-top: 6px; }
.top-list { display: grid; gap: 2px; }
.top-list div { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.top-list div:last-child { border-bottom: 0; }
.top-list .rk { font: 700 15px/1 var(--f-display); color: var(--faint); }
.top-list small { color: var(--muted); font-size: 11.5px; }

/* ---------- tablas ---------- */
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--panel-2); }
.tbl td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr { transition: background .1s; }
.tbl tbody tr.click { cursor: pointer; }
.tbl tbody tr.click:hover { background: var(--hover); }
.tbl tr.sel td { background: var(--accent-soft); }
.tbl tr.warnrow td { background: var(--warn-soft); }
.tbl tr.warnrow td:first-child { box-shadow: inset 3px 0 0 var(--warn-line); }
.tbl .sub { font-size: 11.5px; color: var(--muted); }
.tbl .acts { display: flex; gap: 6px; justify-content: flex-end; }
.empty { text-align: center; padding: 34px 16px; color: var(--muted); display: grid; gap: 8px; justify-items: center; }
.empty .i { width: 28px; height: 28px; color: var(--faint); }
.empty b { color: var(--fg); font-size: 14px; }

/* ---------- tablero de pedidos ---------- */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filters .search-inline { width: min(100%, 260px); }
.filters .select, .filters .input[type=date] { width: auto; max-width: 100%; min-height: 34px; padding: 5px 10px; font-size: 13px; }
.board-wrap { overflow-x: auto; padding-bottom: 6px; margin-inline: -4px; padding-inline: 4px; }
.board { display: grid; grid-template-columns: repeat(6, minmax(180px, 1fr)); gap: 10px; min-width: 1130px; align-items: start; }
.col { background: var(--hover); border-radius: 12px; padding: 10px; display: grid; gap: 8px; align-content: start; min-height: 320px; border: 1px solid transparent; transition: border-color .15s, background .15s; }
.col.drop { border-color: var(--accent); background: var(--accent-soft); }
.col-head { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; padding: 2px 4px 4px; }
.col-head .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.col-head .n { margin-left: auto; font-size: 11.5px; color: var(--muted); background: var(--panel); border-radius: 999px; padding: 1px 8px; border: 1px solid var(--line); }
.ocard { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; display: grid; gap: 7px; cursor: pointer; box-shadow: 0 1px 1px rgba(22,20,26,.03); }
.ocard:hover { border-color: var(--line-2); box-shadow: var(--shadow); }
.ocard.isnew { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.ocard.late { border-color: var(--warn-line); box-shadow: 0 0 0 2px var(--warn-soft); }
.ocard.verylate { border-color: var(--bad); box-shadow: 0 0 0 2px var(--bad-soft); }
.ocard.dragging { opacity: .45; }
.ocard .r1 { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.ocard .no { font-weight: 800; font-size: 14px; }
.ocard .ago { font-size: 11.5px; color: var(--faint); white-space: nowrap; }
.ocard .nm { font-weight: 600; font-size: 13px; }
.ocard .meta { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.ocard .r3 { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.ocard .tot { font-weight: 800; font-size: 14px; }
.timer-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
.timer-chip.bad { background: var(--bad-soft); color: var(--bad); }
.col .more { text-align: center; font-size: 12px; color: var(--muted); padding: 4px; }
.col .dropzone { border: 1.5px dashed var(--line-2); border-radius: 10px; padding: 14px; text-align: center; font-size: 12px; color: var(--faint); }

/* ---------- drawer y modal ---------- */
.scrim { position: fixed; inset: 0; background: rgba(12, 11, 14, .45); z-index: 70; animation: fade .18s ease; }
@keyframes fade { from { opacity: 0; } }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(100%, 520px); background: var(--panel); z-index: 71; display: flex; flex-direction: column;
  box-shadow: var(--shadow-lg); animation: slide .22s cubic-bezier(.2,.7,.2,1); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
@keyframes slide { from { transform: translateX(40px); opacity: 0; } }
.drawer-head { padding: 16px 20px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.drawer-head h2 { font-size: 18px; font-weight: 800; }
.drawer-body { flex: 1; overflow-y: auto; padding: 16px 20px; display: grid; gap: 18px; align-content: start; }
.drawer-foot { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; }
.drawer-foot .btn-primary, .drawer-foot .btn-ok { margin-left: auto; }
.sect-t { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin-bottom: 8px; }
.steps { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
.steps div { font-size: 10.5px; color: var(--faint); padding-top: 7px; border-top: 3px solid var(--line); }
.steps div.done { border-color: var(--accent); color: var(--fg); font-weight: 600; }
.steps div.cur { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.kv { display: grid; gap: 8px; }
.kv-row { display: flex; align-items: flex-start; gap: 10px; font-size: 13.5px; }
.kv-row > .i { color: var(--faint); margin-top: 1px; }
.kv-row .grow small { display: block; color: var(--muted); font-size: 12px; }
.items { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.items .it { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.items .it:last-of-type { border-bottom: 0; }
.items .it .q { font-weight: 700; }
.items .it small { display: block; color: var(--muted); font-size: 12px; }
.items .it .note { color: var(--warn); font-weight: 600; }
.items .tots { background: var(--panel-2); padding: 10px 12px; display: grid; gap: 4px; font-size: 13px; border-top: 1px solid var(--line); }
.items .tots div { display: flex; justify-content: space-between; }
.items .tots .t { font-weight: 800; font-size: 15px; padding-top: 4px; }
.paybox { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 10px; background: var(--panel-2); }
.paybox.warn { background: var(--warn-soft); border-color: var(--warn-line); }
.paybox.ok { background: var(--ok-soft); border-color: transparent; }
.paybox.bad { background: var(--bad-soft); border-color: transparent; }
.log { display: grid; gap: 6px; font-size: 12.5px; }
.log div { display: flex; gap: 10px; }
.log time { color: var(--faint); width: 42px; flex: none; }
.modal-wrap { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 16px; padding-top: max(16px, env(safe-area-inset-top, 0px)); overflow-y: auto; }
.modal { width: min(100%, 520px); background: var(--panel); border-radius: 14px; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; max-height: calc(100vh - 32px); animation: pop .18s cubic-bezier(.2,.7,.2,1); position: relative; }
.modal.wide { width: min(100%, 860px); }
.modal.mid { width: min(100%, 640px); }
@keyframes pop { from { transform: scale(.97); opacity: 0; } }
.modal-head { display: flex; align-items: flex-start; gap: 12px; padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
.modal-head .mi { width: 34px; height: 34px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.modal-head h2 { font-size: 16px; font-weight: 700; }
.modal-head .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.modal-head .x { margin-left: auto; }
.modal-body { padding: 16px 18px; overflow-y: auto; display: grid; gap: 14px; align-content: start; }
.modal-foot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; align-items: center; }
.modal-foot .note { margin-right: auto; font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; max-width: 360px; }
.toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(20px, env(safe-area-inset-bottom, 0px)); z-index: 90; display: grid; gap: 8px; justify-items: center; pointer-events: none; width: min(92vw, 420px); }
.toast { background: #16141a; color: #fff; border-radius: 10px; padding: 11px 14px; font-size: 13px; display: flex; gap: 10px; align-items: center; box-shadow: var(--shadow-lg); animation: up .25s ease; pointer-events: auto; }
.toast .i { color: #4ade80; }
.toast.err .i { color: #f87171; }
.toast button { margin-left: 6px; background: none; border: 0; color: #ffb4b7; font-weight: 700; padding: 0; }
@keyframes up { from { transform: translateY(10px); opacity: 0; } }
@media (min-width: 901px) { .toasts { left: max(20px, env(safe-area-inset-left, 0px)); transform: none; justify-items: start; width: 380px; } }
.note-box { display: flex; gap: 10px; align-items: flex-start; font-size: 12.5px; padding: 10px 12px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); }
.note-box .i { margin-top: 1px; flex: none; }
.note-box.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.note-box.warn { background: var(--warn-soft); color: var(--warn); border-color: var(--warn-line); }
.note-box.info { background: var(--info-soft); color: var(--info); border-color: transparent; }
.note-box b { font-weight: 700; }

/* ---------- cocina ---------- */
.kds { min-height: 100vh; background: var(--kds-bg); color: #f2f0f4; display: flex; flex-direction: column; color-scheme: dark; }
.kds-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-block: 12px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid #222026; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--kds-bg); z-index: 5; }
.kds-top .ttl b { display: block; font-size: 14px; }
.kds-top .ttl small { font-size: 11.5px; color: #8f8994; }
.kds-tabs { display: inline-flex; background: #19171c; border-radius: 9px; padding: 3px; gap: 2px; }
.kds-tabs button { border: 0; background: none; color: #a59fad; padding: 6px 12px; border-radius: 7px; font-weight: 600; font-size: 12.5px; display: inline-flex; gap: 7px; align-items: center; }
.kds-tabs button.on { background: #2a272f; color: #fff; }
.kds-tabs .c { background: #3a3640; border-radius: 6px; padding: 0 6px; font-size: 11px; }
.kds-tabs button.on .c.red { background: #e3161f; }
.kds-btn { border: 1px solid #2e2b33; background: #17151a; color: #e5e1e8; border-radius: 8px; height: 34px; padding: 0 11px; display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 12.5px; }
.kds-btn:hover { background: #221f26; }
.kds-btn.on { border-color: #e3161f; }
.kds-clock { font: 700 26px/1 var(--f-body); letter-spacing: -.02em; }
@media (max-width: 1420px) { .kds-btn .lb { display: none; } .kds-btn { padding: 0 9px; } }
.kds-legend { display: flex; gap: 16px; font-size: 11.5px; color: #8f8994; padding-block: 8px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); flex-wrap: wrap; }
.kds-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.kds-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; padding-block: 4px 24px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); align-content: start; }
.kcard { background: var(--kds-card); color: var(--kds-fg); border-radius: 10px; display: flex; flex-direction: column; min-height: 250px; overflow: hidden; border: 3px solid transparent; }
.kcard.y { border-color: #f5c242; }
.kcard.r { border-color: #e3161f; }
.kcard-h { display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: #f1eff2; }
.kcard.y .kcard-h { background: #fff3c9; }
.kcard.r .kcard-h { background: #e3161f; color: #fff; }
.kcard-h .no { font-weight: 800; font-size: 17px; }
.kcard-h .tp { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; display: inline-flex; gap: 4px; align-items: center; }
.kcard-h .tm { margin-left: auto; font: 700 18px/1 var(--f-body); display: inline-flex; align-items: center; gap: 4px; }

const _fmt = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });

async function queryDays(from, to) {
  if (!db) return [];
  const out = [];
  let a = from;
  while (a <= to) {
    const b = addDays(a, 14) < to ? addDays(a, 14) : to;

function sameNode(x, y) {

  if (x.nodeType === 1) return x.getAttribute('data-key') === y.getAttribute('data-key');

}
function patchKids(a, b) {
  const an = Array.from(a.childNodes), bn = Array.from(b.childNodes);
  for (let i = 0; i < bn.length; i++) {
    const x = an[i], y = bn[i];
    if (!x) { a.appendChild(y); continue; }
    if (!sameNode(x, y)) { a.replaceChild(y, x); continue; }
    if (x.nodeType !== 1) { if (x.nodeValue !== y.nodeValue) x.nodeValue = y.nodeValue; continue; }
    patchEl(x, y);
  }
  for (let i = an.length - 1; i >= bn.length; i--) a.removeChild(an[i]);
}
function patchEl(x, y) {
  const wantSel = x.tagName === 'SELECT' ? y.value : null;
  for (const at of Array.from(x.attributes)) if (!y.hasAttribute(at.name)) x.removeAttribute(at.name);
  for (const at of Array.from(y.attributes)) if (x.getAttribute(at.name) !== at.value) x.setAttribute(at.name, at.value);
  if (x.tagName === 'INPUT') {
    if (x.type === 'checkbox' || x.type === 'radio') { const c = y.hasAttribute('checked'); if (x.checked !== c) x.checked = c; }

    return;
  }
  if (x.tagName === 'TEXTAREA') { if (document.activeElement !== x && x.value !== y.value) x.value = y.value; return; }
  patchKids(x, y);

function tick() {
  const u = umbral();
  for (const el of $$('[data-since]')) {
    const ms = +el.dataset.since, f = el.dataset.fmt;
    const txt = f === 'mmss' ? mmss(ms) : f === 'min' ? minsSince(ms) + ' min' : hace(ms);
    if (el.textContent !== txt) el.textContent = txt;
  }
  for (const el of $$('[data-late]')) {

function niceMax(v) {
  if (v <= 0) return 1;
  const e = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 1.2, 1.6, 2, 2.4, 4, 5, 6, 8, 10]) if (m * e >= v) return m * e;
  return 10 * e;
}
function smoothPath(pts) {
  if (pts.length < 2) return '';
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}
function lineChart({ labels, values, tips, w = 640, h = 220, every = 1 }) {
  const L = 52, R = 14, T = 14, B = 26, iw = w - L - R, ih = h - T - B;
  const max = niceMax(Math.max(...values, 1));
  const x = i => L + (values.length === 1 ? iw / 2 : i * iw / (values.length - 1));
  const y = v => T + ih - v / max * ih;
  const pts = values.map((v, i) => [x(i), y(v)]);
  const ticks = [0, .25, .5, .75, 1].map(f => f * max);
  const last = pts[pts.length - 1];
  let s = `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Gráfico de ventas">`;
  for (const t of ticks) s += `<line class="grid" x1="${L}" x2="${w - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${clpShort(t).replace(' mil', 'k').replace('$0', '$0')}</text>`;
  labels.forEach((l, i) => { if (i % every === 0 || i === labels.length - 1) s += `<text x="${x(i)}" y="${h - 6}" text-anchor="middle" ${i === labels.length - 1 ? 'style="font-weight:700;fill:var(--fg)"' : ''}>${esc(l)}</text>`; });
  s += `<path class="ar" d="${smoothPath(pts)} L${last[0]},${T + ih} L${pts[0][0]},${T + ih}Z"/>`;
  s += `<path class="ln" d="${smoothPath(pts)}"/>`;
  s += `<circle class="pt" cx="${last[0]}" cy="${last[1]}" r="5"/>`;
  const bw = iw / Math.max(1, values.length - 1);
  values.forEach((v, i) => { s += `<rect class="hit" x="${x(i) - bw / 2}" y="${T}" width="${bw}" height="${ih}" data-tip="${esc(tips[i])}" data-px="${(x(i) / w * 100).toFixed(2)}" data-py="${(y(v) / h * 100).toFixed(2)}"/>`; });
  return `<div class="chart-wrap">${s}</svg></div>`;
}
function barChart({ labels, values, tips, hl = [], w = 760, h = 230 }) {
  const L = 52, R = 8, T = 18, B = 26, iw = w - L - R, ih = h - T - B;
  const max = niceMax(Math.max(...values, 1));
  const n = values.length, gap = n > 20 ? 4 : 8, bw = Math.max(4, (iw - gap * (n - 1)) / n);
  const y = v => T + ih - v / max * ih;
  let s = `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Gráfico de barras">`;
  for (const f of [0, .25, .5, .75, 1]) { const t = f * max; s += `<line class="grid" x1="${L}" x2="${w - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${clpShort(t).replace(' mil', 'k')}</text>`; }
  values.forEach((v, i) => {
    const bx = L + i * (bw + gap), by2 = y(v);
    s += `<rect class="bar ${hl.includes(i) ? 'hl' : ''}" x="${bx.toFixed(1)}" y="${by2.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0, T + ih - by2).toFixed(1)}" rx="2"/>`;
    s += `<text x="${(bx + bw / 2).toFixed(1)}" y="${h - 6}" text-anchor="middle" ${hl.includes(i) ? 'style="font-weight:700;fill:var(--fg)"' : ''}>${esc(labels[i])}</text>`;
    s += `<rect class="hit" x="${bx.toFixed(1)}" y="${T}" width="${(bw + gap).toFixed(1)}" height="${ih}" data-tip="${esc(tips[i])}" data-px="${((bx + bw / 2) / w * 100).toFixed(2)}" data-py="${(by2 / h * 100).toFixed(2)}"/>`;
  });
  return `<div class="chart-wrap">${s}</svg></div>`;
}
function donut(segs, center, sub) {
  const total = sum(segs, s => s.v) || 1, r = 52, c = 2 * Math.PI * r;
  let off = 0, s = '';
  for (const sg of segs) {
    const len = sg.v / total * c;
    if (sg.v > 0) s += `<circle cx="70" cy="70" r="${r}" fill="none" stroke="${sg.c}" stroke-width="18" stroke-dasharray="${Math.max(0, len - 2).toFixed(2)} ${c.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 70 70)"/>`;
    off += len;
  }
  if (!sum(segs, x => x.v)) s = `<circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--line)" stroke-width="18"/>`;
  return `<svg viewBox="0 0 140 140" width="140" height="140" style="flex:none;max-width:100%" role="img" aria-label="Pedidos por estado">${s}<text x="70" y="70" text-anchor="middle" style="font:800 26px var(--f-body);fill:var(--fg)">${center}</text><text x="70" y="88" text-anchor="middle" style="font-size:11px;fill:var(--muted)">${esc(sub)}</text></svg>`;
}
function spark(values) {
  if (values.length < 2) return '';
  const max = Math.max(...values, 1), w = 72, h = 26;
  const pts = values.map((v, i) => [i * w / (values.length - 1), h - 3 - v / max * (h - 6)]);

function barsList(rows, fmt = clp) {

/* arrastrar y soltar */
document.addEventListener('dragstart', e => {
  const c = e.target.closest?.('[data-drag]'); if (!c) return;
  e.dataTransfer.setData('text/plain', c.dataset.drag); e.dataTransfer.effectAllowed = 'move'; c.classList.add('dragging');
});
document.addEventListener('dragend', () => { $$('.dragging').forEach(x => x.classList.remove('dragging')); $$('.col.drop').forEach(x => x.classList.remove('drop')); });
document.addEventListener('dragover', e => {
  const col = e.target.closest?.('[data-col]'); if (!col) return;
  e.preventDefault(); $$('.col.drop').forEach(x => x !== col && x.classList.remove('drop')); col.classList.add('drop');
});
document.addEventListener('drop', e => {
  const col = e.target.closest?.('[data-col]'); if (!col) return;
  e.preventDefault(); col.classList.remove('drop');
  const o = S.byId[e.dataTransfer.getData('text/plain')]; const to = col.dataset.col;
  if (!o || o.estado === to) return;
  if (to === 'camino' && o.tipo !== 'delivery') { toast('Solo los pedidos con delivery pasan a “En camino”.', true); return; }
  if (to === 'camino' && !o.repartidor) { openModal({ kind: 'asignar', id: o.id, then: 'camino' }); return; }
  advance(o, to);
});

function turnoResumen(tur) {
  const now = Date.now();
  const paid = S.orders.filter(o => o.sucursal === tur.sucursal && o.pago?.estado === 'pagado' && o.estado !== 'cancelado' && (o.pago.en || o.creado) >= tur.abiertaEn && (o.pago.en || o.creado) <= now);
  const movs = Object.values(tur.movs || {});
  const ing = sum(movs.filter(x => x.tipo === 'ingreso'), x => x.monto), ret = sum(movs.filter(x => x.tipo === 'retiro'), x => x.monto);
  const rows = Object.keys(METODOS).map(k => {
    const list = paid.filter(o => o.pago.metodo === k);
    const ventas = sum(list, o => o.total);
    return { k, n: list.length, ventas, sistema: k === 'efectivo' ? tur.fondo + ventas + ing - ret : ventas };
  });
  const enTurno = S.orders.filter(o => o.sucursal === tur.sucursal && o.creado >= tur.abiertaEn);
  const verif = S.orders.filter(o => o.sucursal === tur.sucursal && o.pago?.estado === 'verificacion' && o.estado !== 'cancelado' && o.creado >= tur.abiertaEn);
  const anul = enTurno.filter(o => o.estado === 'cancelado');
  return { paid, rows, ing, ret, ventas: sum(paid, o => o.total), pedidos: paid.length, ticket: paid.length ? Math.round(sum(paid, o => o.total) / paid.length) : 0, verif, anul };
}
A['caja-close'] = () => { const tur = turnoAbierto(posSuc()); if (!tur) return; const R = turnoResumen(tur); const c = {}; for (const r of R.rows) c[r.k] = r.k === 'efectivo' ? '' : r.sistema; openModal({ kind: 'caja-close', tid: tur.id, contado: c }); };

        <td class="tr">${r.n}</td><td class="tr"><b>${clp(r.sistema)}</b></td>
        <td class="tr"><input class="input ${diffs[i] ? 'mismatch' : ''}" id="cc-${r.k}" inputmode="numeric" value="${m.contado[r.k]}" placeholder="Contar" data-bind="modal.contado.${r.k}" data-num data-live></td>
        <td class="tr">${diffs[i] === null ? '<span class="faint">—</span>' : diffs[i] === 0 ? `<span class="pill pill-ok">${ic('check', 'i-sm')} Cuadra</span>` : `<span class="pill ${diffs[i] < 0 ? 'pill-warn' : 'pill-info'}">${diffs[i] > 0 ? '+' : ''}${clp(diffs[i])}</span>`}</td></tr>`).join('')}
      </tbody></table></div>
      ${R.verif.length ? `<div class="note-box warn">${ic('alert', 'i-sm')}<span><b>${plural(R.verif.length, 'transferencia sigue', 'transferencias siguen')} en verificación</b> (${R.verif.map(o => `${clp(o.total)}, pedido ${numStr(o)}`).join('; ')}) y no se suma a lo cobrado. Puedes cerrar igual: queda pendiente para el próximo turno.</span></div>` : ''}`,
    foot: `<span class="note">${ic('info', 'i-sm')} Resumen de ventas cobradas por método. No corresponde a utilidad neta ni a un documento tributario.</span><button class="btn" data-act="caja-dl">${ic('download', 'i-sm')} Descargar resumen</button><button class="btn btn-primary" data-act="caja-close-ok">${ic('lock', 'i-sm')} Confirmar cierre</button>` });

function closingText(tur, m) {

function pillPagoEst(e) { const cls = { pagado: 'pill-ok', verificacion: 'pill-warn', rechazado: 'pill-bad', reembolsado: 'pill-info' }[e] || ''; return `<span class="pill ${cls}"><i class="dot"></i>${PAGO_EST[e] || '—'}</span>`; }
VIEWS.pagos = () => {
  const F = S.ui.pagos || (S.ui.pagos = { dia: today(), est: 'todos', met: 'todos' });
  const day = S.orders.filter(o => inSuc(o) && o.fecha === F.dia && o.estado !== 'cancelado' || (inSuc(o) && o.fecha === F.dia && o.pago?.estado === 'reembolsado'));
  const ests = ['pendiente', 'verificacion', 'pagado', 'rechazado', 'reembolsado'];
  const icons = { pendiente: 'clock', verificacion: 'hourglass', pagado: 'checkc', rechazado: 'xc', reembolsado: 'undo' };
  const subs = {
    pendiente: l => 'Se cobra al entregar o retirar', verificacion: l => `Transferencias por revisar · ${clp(sum(l, o => o.total))}`,
    pagado: l => `${clp(sum(l, o => o.total))} cobrados`, rechazado: l => l.length ? 'Pago online no aprobado o abono no encontrado' : 'Sin rechazos', reembolsado: l => l.length ? clp(sum(l, o => o.total)) + ' devueltos' : 'Sin devoluciones',
  };
  const list = day.filter(o => (F.est === 'todos' || o.pago?.estado === F.est) && (F.met === 'todos' || o.pago?.metodo === F.met))
    .sort(by(o => ({ verificacion: 0, rechazado: 1, pendiente: 2, pagado: 3, reembolsado: 4 }[o.pago?.estado] ?? 5) * 1e13 - o.creado));
  const det = o => {
    const p = o.pago || {};
    if (p.estado === 'verificacion') return `Comprobante ${p.comprobante ? 'enviado' : 'por recibir'}${p.en ? ' ' + hhmm(p.en) : ''}`;
    if (p.estado === 'pendiente') return o.tipo === 'delivery' ? `Se cobra al entregar${p.pagaCon ? ' · paga con ' + clp(p.pagaCon) : ''}` : 'Se cobra al retirar';
    if (p.estado === 'pagado') return p.metodo === 'online' ? `Confirmado por Flow${p.ref ? ' · orden ' + esc(p.ref) : ''}` : `${p.por && S.staff[p.por]?.rol === 'repartidor' ? 'Cobró ' : 'Registrado por '}${esc(shortName(staffName(p.por)))}${p.en ? ' · ' + hhmm(p.en) : ''}`;
    if (p.estado === 'rechazado') return p.metodo === 'online' ? 'Flow: pago no aprobado por el banco' : 'Abono no encontrado';
    return 'Devuelto al cliente';
  };
  const acts = o => {
    const p = o.pago || {};
    if (!isRole('admin', 'caja')) return '';
    if (p.estado === 'verificacion') return `<button class="btn btn-xs" data-act="pay-proof" data-id="${o.id}">${ic('image', 'i-sm')} Ver</button><button class="btn btn-xs btn-dark" data-act="pay-ok" data-id="${o.id}">${ic('check', 'i-sm')} Confirmar</button><button class="btn btn-xs btn-ghost" data-act="pay-reject" data-id="${o.id}" aria-label="Rechazar">${ic('x', 'i-sm')}</button>`;
    if (p.estado === 'pendiente') return `<button class="btn btn-xs" data-act="pay-register" data-id="${o.id}">Registrar</button>`;

    if (p.estado === 'pagado') return `<button class="btn btn-xs btn-ghost" data-act="pay-refund" data-id="${o.id}" title="Marcar como devuelto">${ic('undo', 'i-sm')}</button>`;

    ${pageHead('Pagos', 'Cada pago pasa por un estado. Solo se cuenta como cobrado cuando está verificado.',
    `<input class="input" type="date" id="pg-dia" value="${F.dia}" max="${today()}" data-bind="ui.pagos.dia" data-live aria-label="Día">

    <div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">${ests.map(e => { const l = day.filter(o => o.pago?.estado === e); const on = F.est === e; return `<button class="kpi ${e === 'verificacion' && l.length ? 'alert' : ''}" style="text-align:left;${on ? 'border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)' : ''}" data-act="pagos-est" data-e="${e}"><div class="kpi-top">${pillPagoEst(e)}<span style="margin-left:auto">${ic(icons[e], 'i-sm')}</span></div><div class="kpi-v">${l.length}</div><div class="kpi-s">${subs[e](l)}</div></button>`; }).join('')}</div>
    <div class="note-box ok">${ic('shield', 'i-sm')}<span><b>Flow</b> confirma los pagos online por su cuenta. <b>Transferencias</b> y <b>Edenred</b> los confirma alguien del local, y queda registrado quién y cuándo. No se guardan números de tarjeta.</span></div>
    ${F.est !== 'todos' ? `<div><button class="btn btn-sm" data-act="pagos-est" data-e="todos">${ic('x', 'i-sm')} Quitar filtro: ${PAGO_EST[F.est]}</button></div>` : ''}
    ${list.length ? `<div class="card tbl-wrap"><table class="tbl"><thead><tr><th>Pedido</th><th>Método</th><th class="tr">Monto</th><th>Estado</th><th>Detalle</th><th class="tr">Acciones</th></tr></thead><tbody>

        <td><span class="row">${ic(METODOS[o.pago?.metodo]?.ic || 'cash', 'i-sm')}${esc(METODOS[o.pago?.metodo]?.l || '')}</span></td><td class="tr"><b>${clp(o.total)}</b></td><td>${pillPagoEst(o.pago?.estado)}</td>

const CENTER = { lat: -30.6015, lng: -71.1990 };
function pinPos(o) {
  const e = o.entrega || {};
  if (e.lat && e.lng) {
    const x = 200 + (e.lng - CENTER.lng) / 0.028 * 150, y = 150 - (e.lat - CENTER.lat) / 0.022 * 110;
    return [Math.max(18, Math.min(382, x)), Math.max(14, Math.min(286, y))];
  }
  let h = 0; for (const ch of String(o.id)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const ang = (h % 360) * Math.PI / 180, r = (e.zona === 'fuera' ? 135 : 30 + (h >> 8) % 85);
  return [200 + Math.cos(ang) * r * 1.25, 150 + Math.sin(ang) * r * .82];
}
function deliveryMap(orders, opts = {}) {
  let streets = '';
  for (let x = 20; x < 400; x += 34) streets += `<line class="street" x1="${x}" y1="0" x2="${x + 18}" y2="300"/>`;
  for (let y = 12; y < 300; y += 30) streets += `<line class="street" x1="0" y1="${y}" x2="400" y2="${y - 8}"/>`;
  const zone = '135,40 265,38 330,95 335,190 270,255 140,262 70,200 66,100';
  const pins = orders.map(o => { const [x, y] = pinPos(o); const lbl = numStr(o); return `<g class="pin ${o.estado === 'camino' ? 'vio' : ''}" transform="translate(${x.toFixed(0)},${y.toFixed(0)})"><rect x="-21" y="-10" width="42" height="18" rx="5"/><text x="0" y="3" text-anchor="middle">${lbl}</text></g>`; }).join('');
  return `<div class="map"><svg viewBox="0 0 400 300" role="img" aria-label="Esquema de la zona de despacho">${streets}<polygon class="zone" points="${zone}"/><g class="pin lc" transform="translate(200,150)"><rect x="-19" y="-10" width="38" height="18" rx="5"/><text x="0" y="3" text-anchor="middle">Local</text></g>${pins}</svg>
    <span class="map-cap"><i></i> Dentro de la zona: ${clp(tarifa())}${opts.legend ? ' · ' + opts.legend : ''}</span></div>`;
}

}

const INF_CACHE = {};
function rangeOrders(from, to) {
  const loadedFrom = addDays(today(), -31);
  if (from >= loadedFrom) return { list: S.orders.filter(o => o.fecha >= from && o.fecha <= to), ready: true };
  const key = from + '_' + to, c = INF_CACHE[key];
  if (c?.list) {
    const fresh = S.orders.filter(o => o.fecha >= loadedFrom && o.fecha >= from && o.fecha <= to);
    const ids = new Set(fresh.map(o => o.id));
    return { list: [...c.list.filter(o => !ids.has(o.id)), ...fresh], ready: true };
  }
  if (!c) { INF_CACHE[key] = { loading: true }; queryDays(from, to).then(list => { INF_CACHE[key] = { list }; render(); }).catch(() => { INF_CACHE[key] = { list: [] }; render(); }); }
  return { list: [], ready: false };
}
function infRange(p) {
  const k = today(), [y, m] = k.split('-').map(Number);
  const mk = (yy, mm, dd) => `${yy}-${String(mm).padStart(2, '0')}-${String(dd).padStart(2, '0')}`;
  const lastDay = (yy, mm) => new Date(Date.UTC(yy, mm, 0)).getUTCDate();
  const pm = m === 1 ? 12 : m - 1, py = m === 1 ? y - 1 : y;
  if (p === 'mes') { const d = +k.slice(8); return { from: mk(y, m, 1), to: k, label: `${MESES[m - 1]} ${y}, del 1 al ${d}`, pFrom: mk(py, pm, 1), pTo: mk(py, pm, Math.min(d, lastDay(py, pm))), pLabel: MESES[pm - 1] }; }
  if (p === 'mesant') { const ppm = pm === 1 ? 12 : pm - 1, ppy = pm === 1 ? py - 1 : py; return { from: mk(py, pm, 1), to: mk(py, pm, lastDay(py, pm)), label: `${MESES[pm - 1]} ${py}`, pFrom: mk(ppy, ppm, 1), pTo: mk(ppy, ppm, lastDay(ppy, ppm)), pLabel: MESES[ppm - 1] }; }
  const n = p === '7' ? 7 : 30;
  return { from: addDays(k, -n + 1), to: k, label: `últimos ${n} días`, pFrom: addDays(k, -2 * n + 1), pTo: addDays(k, -n), pLabel: `los ${n} días anteriores` };
}

  const filt = l => l.filter(o => inSuc(o) && (F.canal === 'todos' || o.canal === F.canal) && (F.pago === 'todos' || o.pago?.metodo === F.pago));
  const L = filt(cur.list), P = filt(prev.list);
  const paid = L.filter(cobrado), pPaid = P.filter(cobrado);
  const ventas = sum(paid, o => o.total), pVentas = sum(pPaid, o => o.total);
  const entregados = L.filter(o => o.estado === 'entregado').length, pEnt = P.filter(o => o.estado === 'entregado').length;
  const ticket = paid.length ? Math.round(ventas / paid.length) : 0, pTicket = pPaid.length ? Math.round(pVentas / pPaid.length) : 0;
  const inR = (ms, a, b) => ms && dayKey(ms) >= a && dayKey(ms) <= b;

A['st-ok'] = async () => {
  const m = S.modal, em = m.email.trim().toLowerCase();
  if (!m.nombre.trim() || !/\S+@\S+\.\S+/.test(em)) { m.err = 'Escribe el nombre y un correo válido.'; render(); return; }
  if (Object.values(S.staff).some(s => s.id !== m.id && (s.email || '').toLowerCase() === em)) { m.err = 'Ya hay un usuario con ese correo.'; render(); return; }
  if ((!m.id || m.pass) && (m.pass || '').length < 6) { m.err = 'La contraseña debe tener al menos 6 caracteres.'; render(); return; }
  if (m.id === S.me.id && (m.rol !== 'admin' || !m.activo)) { m.err = 'No puedes quitarte a ti el cargo de administración ni desactivarte.'; render(); return; }
  const data = { nombre: m.nombre.trim(), email: em, rol: m.rol, sucursal: m.sucursal, tel: m.tel.trim(), activo: !!m.activo };
  if (m.pass) { data.salt = uid('s'); data.pass = await hashPass(m.pass, data.salt); }
  const id = m.id || uid('u');
  closeModal();
  const ok = await W(() => m.id ? db.doc('staff/' + id).update(data) : db.doc('staff/' + id).set({ ...data, creado: Date.now(), enTurno: true }), m.id ? 'Usuario actualizado' : 'Usuario creado');

const STREETS = ['Av. La Feria', 'Vicuña Mackenna', 'Los Aromos', 'Tangue', 'Benavente', 'Ariztía', 'Socos', 'Los Pimientos', 'Libertad', 'Miguel Aguirre', 'Independencia', 'Coquimbo', 'Victoria', 'Santiago', 'Covarrubias', 'Los Carrera', 'Gabriela Mistral', 'Maestranza'];
A['demo-sim'] = async el => {
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const prods = Object.values(S.productos).filter(p => p.visible !== false && !p.agotado && productAvail(p).ok && !['salsas'].includes(p.seccion));
  if (!prods.length) { toast('No hay productos disponibles para simular.', true); return; }
  el.disabled = true;
  const cls = Object.values(S.clientes);
  const c = Math.random() < .85 && cls.length ? pick(cls) : null;
  const items = [];
  const n = 1 + Math.floor(Math.random() * 3);
  for (let i = 0; i < n; i++) {
    const p = pick(prods); const sel = defaultSel(p);
    for (const g of p.opciones || []) if (g.obligatorio && !(sel[g.id] || []).length) { const it = g.items.find(x => !x.agotado); if (it) sel[g.id] = [it.id]; }
    if (selMissing(p, sel).length) continue;
    items.push({ pid: p.id, nombre: p.nombre, cant: Math.random() < .2 ? 2 : 1, precio: selPrice(p, sel), opciones: selText(p, sel), nota: Math.random() < .15 ? pick(['Cortar en 8', 'Salsa aparte', 'Sin cebollín', 'Bien frito']) : '' });
  }
  if (Math.random() < .5) { const s = Object.values(S.productos).find(p => /soya/i.test(p.nombre)); if (s) items.push({ pid: s.id, nombre: s.nombre, cant: 2, precio: s.precio, opciones: [], nota: '' }); }
  if (!items.length) { el.disabled = false; return; }
  const tipo = Math.random() < .65 ? 'delivery' : 'retiro';
  const subtotal = sum(items, i => i.precio * i.cant), delivery = tipo === 'delivery' ? tarifa() : 0, total = subtotal + delivery;
  const met = pick(['online', 'online', 'transferencia', 'efectivo', 'efectivo', 'edenred']);
  const pago = met === 'online' ? { metodo: 'online', estado: 'pagado', en: Date.now(), ref: String(9000000 + Math.floor(Math.random() * 99999)) } : met === 'transferencia' ? { metodo: 'transferencia', estado: 'verificacion', comprobante: true, en: Date.now() } : { metodo: met, estado: 'pendiente', ...(met === 'efectivo' ? { pagaCon: Math.ceil(total / 10000) * 10000 } : {}) };
  const suc = S.suc !== 'todas' ? S.suc : pick(sucursales()).id;
  const nombre = c?.nombre || pick(['Martina', 'Josefa', 'Tomás', 'Benjamín', 'Agustina', 'Vicente']) + ' ' + pick(['Rojas', 'Pizarro', 'Araya', 'Cortés', 'Tapia']);
  const now = Date.now();
  const o = clean({ creado: now, sucursal: suc, canal: 'web', tipo, cliente: { id: c?.id || '', nombre, tel: c?.tel || '', email: c?.email || '' },
    entrega: tipo === 'delivery' ? { direccion: (c?.direcciones?.slice(-1)[0]) || `${pick(STREETS)} ${100 + Math.floor(Math.random() * 1800)}, Ovalle`, referencia: Math.random() < .4 ? pick(['Casa esquina, reja verde', 'Depto 302, timbre malo', 'Frente a la plaza']) : '', zona: Math.random() < .08 ? 'fuera' : 'dentro' } : null,
    retiroHora: tipo === 'retiro' ? hhmm(now + 30 * 60e3) : '', items, subtotal, delivery, descuento: 0, total, pago, estado: 'recibido', t: { recibido: now }, alergia: c?.alergias || '', nota: '', demo: true });
  const ok = await W(() => createOrder(o));
  el.disabled = false;
  if (ok) toast('Llegó un pedido simulado de la página', false, 'spark');
};
A['demo-clear'] = () => {
  if (S.me.demo) { toast('Primero crea tu usuario de administración real en Usuarios y entra con él.', true); return; }
  confirmBox({ title: 'Borrar los datos de ejemplo', text: 'Se borran los pedidos, clientes, turnos de caja y usuarios de prueba. La carta, las sucursales, la configuración y tu usuario quedan igual. No se puede deshacer.', ok: 'Borrar datos de ejemplo', danger: true, run: clearDemo });
};
async function clearDemo() {
  toast('Borrando datos de ejemplo…', false, 'trash');
  const ok = await W(async () => {
    const dias = await db.collection('dias').get();
    let maxReal = 0;
    for (const d of dias.docs) {
      const ps = d.data().pedidos || {};
      const real = Object.entries(ps).filter(([, o]) => !o.demo);
      for (const [, o] of real) maxReal = Math.max(maxReal, o.num || 0);
      if (!real.length) await db.doc('dias/' + d.id).delete();
      else if (real.length !== Object.keys(ps).length) await db.doc('dias/' + d.id).set({ ...d.data(), pedidos: Object.fromEntries(real) });
      await sleep(60);
    }
    for (const c of Object.values(S.clientes).filter(c => c.demo)) { await db.doc('clientes/' + c.id).delete(); await sleep(40); }
    for (const t of (await db.collection('turnos').where('demo', '==', true).get()).docs) await db.doc('turnos/' + t.id).delete();
    for (const st of Object.values(S.staff).filter(s => s.demo && s.id !== S.me.id)) await db.doc('staff/' + st.id).delete();
    await db.doc('config/contador').set({ n: maxReal });
    await queued('config/general', () => db.doc('config/general').update({ demo: false }));
  }, 'Datos de ejemplo borrados');
  if (ok) log('Borró los datos de ejemplo');
}

  const users = [...new Set((items || []).map(i => i.u))];
  const list = (items || []).filter(i => F.u === 'todos' || i.u === F.u).sort(by(i => i.t, -1));
  return `<div class="page">${pageHead('Historial de actividad', 'Quién cambió qué y cuándo.', `<input class="input" type="date" id="ac-d" value="${F.dia}" max="${today()}" data-bind="ui.act.dia" data-live aria-label="Día"><select class="select" id="ac-u" data-bind="ui.act.u" aria-label="Persona"><option value="todos">Todas las personas</option>${users.map(u => `<option value="${u}" ${F.u === u ? 'selected' : ''}>${esc(staffName(u))}</option>`).join('')}</select>`, 'Estadísticas › Historial de actividad')}
    <div class="card">${items === null ? `<p class="muted" style="padding:16px">Cargando…</p>` : list.length ? `<div style="padding:4px 18px">${list.map(i => `<div class="drow" style="grid-template-columns:52px auto minmax(0,1fr)"><span class="muted num">${hhmm(i.t)}</span><span class="avatar avatar-sm">${esc(initials(staffName(i.u)))}</span><div style="min-width:0"><span class="nm" style="font-weight:600">${esc(staffName(i.u))}</span><small>${esc(i.a)}</small></div></div>`).join('')}</div>` : emptyState('history', 'Sin actividad registrada', 'Aquí aparecen los cambios de estado, pagos, precios y usuarios.')}</div>
  </div>`;
};

boot();
</script>

</body></html>
